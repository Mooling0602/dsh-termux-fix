name: Bug report
description: Something in install.sh or a step script does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you report, make sure you are on the latest commit — a fix may
        already be in `main`. Run this, then paste the whole output below:

        ```bash
        cd dsh-termux-fix && git pull && ./install.sh --check
        ```

        That is the only command you need. Its header carries the commit, dsh
        version, Node version and architecture, so nothing has to be collected
        by hand.

  - type: textarea
    id: check
    attributes:
      label: Output of ./install.sh --check
      description: >
        Paste it in full — keep the header lines. They identify the commit and
        versions the report was produced with.
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and the complete error output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: >
        Anything else that might help — workarounds you found, changes you made
        to a step, related issues, or output from a command you already ran.
      render: text
    validations:
      required: false
