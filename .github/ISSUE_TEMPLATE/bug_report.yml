name: Bug report
description: Something in install.sh or a step script does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before you report, make sure you are on the latest commit — a fix may
        already be in `main`.

        ```bash
        cd dsh-termux-fix
        git pull
        ./install.sh --check
        git rev-parse --short HEAD    # paste this below
        ```

  - type: input
    id: commit
    attributes:
      label: Commit
      description: >
        Output of `git rev-parse --short HEAD` in your dsh-termux-fix checkout,
        after pulling. Issues without a commit hash are hard to verify — the
        code may already differ from what you are running.
      placeholder: e.g. 359568a
    validations:
      required: true

  - type: textarea
    id: check
    attributes:
      label: Output of ./install.sh --check
      description: Paste it in full. It reports the state of every patch.
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran and the complete error output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Versions
      description: >
        dsh version (`npm view @deepseek-ai/dsh version` or the line printed by
        `--check`), Node (`node -v`), and architecture (`uname -m`).
      placeholder: dsh 0.2.1-rc.2, Node v26.4.0, aarch64
    validations:
      required: true
